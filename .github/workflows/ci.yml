name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bộ test
        run: node --test
      - name: Rà soát mã và đối chiếu SHA256SUMS
        run: node tools/pack.mjs --check

  release:
    # Đẩy tag v<phiên bản> (vd. v1.0.0). Phiên bản 0.x được đăng dạng pre-release (beta) thì đóng gói và đăng file zip kèm hash lên Releases.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag phải khớp phiên bản trong manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME khác phiên bản $version"; exit 1; }
      - name: Đóng gói
        run: node tools/pack.mjs
      - name: Đăng lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="df-code-garena-${GITHUB_REF_NAME#v}.zip"
          flags=""
          title="DF Code Garena ${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease"; title="$title beta" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release đã được tạo trên web. File zip đã đính kèm thì đối chiếu với bản vừa đóng gói lại,
            # không ghi đè; khác hash nghĩa là file trên Releases không phải đóng gói từ mã ở tag này.
            if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx "$name"; then
              gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir dist/remote
              if cmp -s "dist/$name" "dist/remote/$name"; then
                echo "File $name trên Releases khớp với bản đóng gói lại từ mã nguồn."
              else
                echo "::error::File $name trên Releases KHÁC bản đóng gói lại từ mã ở tag này."
                exit 1
              fi
            else
              gh release upload "$GITHUB_REF_NAME" "dist/$name" "dist/$name.sha256"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "dist/$name" "dist/$name.sha256" $flags \
              --title "$title" --notes-file dist/RELEASE.md
          fi
