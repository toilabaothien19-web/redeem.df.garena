name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bộ test
        run: node --test
      - name: Rà soát mã và đối chiếu SHA256SUMS
        run: node tools/pack.mjs --check

  release:
    # Đẩy tag v<phiên bản> (vd. v2.0.0) thì đóng gói và đăng file zip kèm hash lên Releases.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag phải khớp phiên bản trong manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME khác phiên bản $version"; exit 1; }
      - name: Đóng gói
        run: node tools/pack.mjs
      - name: Đăng lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 \
              --title "DF Code Garena ${GITHUB_REF_NAME#v}" --notes-file dist/RELEASE.md
          fi
